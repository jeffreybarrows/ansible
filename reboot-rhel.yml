---
- name: Reboot RHEL systems
  hosts: all
  become: true
  become_user: root
  become_method: sudo
  serial: 1

  tasks:
    - name: Verify target is RHEL 8, 9, or 10
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "RedHat"
          - ansible_facts["distribution_major_version"] | int in [8, 9, 10]
        fail_msg: >-
          {{ inventory_hostname }} is {{ ansible_facts["distribution"] }}
          {{ ansible_facts["distribution_version"] }}, not a supported RHEL 8/9/10 host.

    - name: Display reboot notification
      ansible.builtin.debug:
        msg: "Rebooting {{ inventory_hostname }}"

    - name: Reboot the system and wait for it to return
      ansible.builtin.reboot:
        msg: "Reboot initiated by Semaphore/Ansible"
        pre_reboot_delay: 5
        post_reboot_delay: 10
        reboot_timeout: 900
        connect_timeout: 10
        test_command: whoami

    - name: Confirm system returned successfully
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} rebooted successfully and is reachable."
