---
- name: Update Proxmox VE hosts
  hosts: all

  tasks:
    - name: Verify connection is running as root
      ansible.builtin.command:
        cmd: id -u
      register: remote_uid
      changed_when: false
      check_mode: false

    - name: Fail if connection is not root
      ansible.builtin.assert:
        that:
          - remote_uid.stdout | trim == "0"
        fail_msg: >-
          Semaphore connected to {{ inventory_hostname }} as a non-root user.
          This Proxmox playbook must connect directly as root.

    - name: Verify target is a Proxmox VE host
      ansible.builtin.command:
        cmd: pveversion
      register: pve_version
      changed_when: false
      check_mode: false

    - name: Display Proxmox VE version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} - {{ pve_version.stdout }}"

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Perform full Proxmox system upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: false
        dpkg_options: "force-confdef,force-confold"

    - name: Remove obsolete downloaded package files
      ansible.builtin.apt:
        autoclean: true
      when: not ansible_check_mode

    - name: Clean APT package cache
      ansible.builtin.apt:
        clean: true
      when: not ansible_check_mode

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report reboot required
      ansible.builtin.debug:
        msg: "REBOOT REQUIRED on Proxmox host {{ inventory_hostname }}"
      when: reboot_required.stat.exists

    - name: Report no reboot required
      ansible.builtin.debug:
        msg: "No reboot currently required on Proxmox host {{ inventory_hostname }}"
      when: not reboot_required.stat.exists
